{# Le portrait-robot d'une personne, dessiné dans une boîte de 100 × 78 : à poser dans un <svg viewBox="0 0 100 78">. #}
{% macro visage(pid, role='') %}{% set v = portrait(pid) %}
<g class="visage{% if role == 'victime' %} defunt{% endif %}">
  {# la toise du service d'identité #}
  <g class="toise">{% for k in range(5) %}<line x1="0" x2="100" y1="{{ 8 + k * 16 }}" y2="{{ 8 + k * 16 }}"/>
    <text x="2" y="{{ 7 + k * 16 }}">{{ 190 - k * 10 }}</text>{% endfor %}</g>
  <g transform="translate({{ v.dx|round(1) }} 0)">
  {% if v.coiffure == 'long' %}<path d="M32,32 Q31,10 50,10 Q69,10 68,32 L71,62 Q62,60 60,46 L40,46 Q38,60 29,62 Z" fill="{{ v.cheveux }}"/>{% endif %}
  {% if v.coiffure == 'chignon' %}<circle cx="50" cy="11" r="7.5" fill="{{ v.cheveux }}"/>{% endif %}
  {# les épaules et le col #}
  <path d="M8,80 Q10,58 50,56 Q90,58 92,80 Z" fill="{{ v.veste }}"/>
  <rect x="44" y="44" width="12" height="15" rx="4" fill="{{ v.peau }}"/>
  <rect x="44" y="44" width="12" height="15" rx="4" fill="#000" opacity=".16"/>
  {% if v.col == 'chemise' %}<path d="M41,57 L50,68 L59,57 L55,56 L50,62 L45,56 Z" fill="#f2efe6"/>
  {% elif v.col == 'cravate' %}<path d="M41,57 L50,66 L59,57 L55,56 L50,61 L45,56 Z" fill="#f2efe6"/><path d="M48.5,62 L51.5,62 L53,78 L50,80 L47,78 Z" fill="#8e1b17"/>
  {% elif v.col == 'noeud' %}<path d="M41,57 L50,64 L59,57 Z" fill="#f2efe6"/><path d="M43,61 L50,64 L43,67 Z M57,61 L50,64 L57,67 Z" fill="#141414"/>
  {% else %}<path d="M40,56 Q50,62 60,56 L60,60 Q50,66 40,60 Z" fill="{{ v.veste }}" stroke="#000" stroke-opacity=".25"/>{% endif %}
  {# la tête #}
  <ellipse cx="34.5" cy="35" rx="3" ry="4.5" fill="{{ v.peau }}"/><ellipse cx="65.5" cy="35" rx="3" ry="4.5" fill="{{ v.peau }}"/>
  {% if v.boucle %}<circle cx="34.5" cy="40.5" r="1.6" fill="#e9b34c"/>{% endif %}
  <ellipse cx="50" cy="33" rx="15.5" ry="18.5" fill="{{ v.peau }}"/>
  {% if v.barbe %}<path d="M35,34 Q36,52 50,53 Q64,52 65,34 Q63,46 50,47 Q37,46 35,34 Z" fill="{{ v.cheveux }}"/>{% endif %}
  {# les cheveux #}
  {% if v.coiffure in ('court', 'chignon', 'long') %}<path d="M34,31 Q33,13 50,13 Q67,13 66,31 Q63,20 50,21 Q37,20 34,31 Z" fill="{{ v.cheveux }}"/>
  {% elif v.coiffure == 'raie' %}<path d="M34,32 Q32,12 50,13 Q68,13 66,32 Q64,21 56,19 Q46,25 34,32 Z" fill="{{ v.cheveux }}"/>
  {% elif v.coiffure == 'boucles' %}{% for cx, cy in [(36,26),(41,18),(49,15),(57,17),(63,24),(66,31),(34,32)] %}<circle cx="{{ cx }}" cy="{{ cy }}" r="5.5" fill="{{ v.cheveux }}"/>{% endfor %}
  {% else %}<path d="M34.5,30 Q34,24 37,22 L37,30 Z M65.5,30 Q66,24 63,22 L63,30 Z" fill="{{ v.cheveux }}"/>{% endif %}
  {# le visage #}
  {% if v.sourcils == 'droits' %}<path d="M40,28 H47 M53,28 H60" stroke="{{ v.cheveux }}" stroke-width="1.8" stroke-linecap="round"/>
  {% elif v.sourcils == 'hauts' %}<path d="M40,28 Q43.5,25 47,27 M53,27 Q56.5,25 60,28" stroke="{{ v.cheveux }}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  {% else %}<path d="M40,27 L47,29 M53,29 L60,27" stroke="{{ v.cheveux }}" stroke-width="2" stroke-linecap="round"/>{% endif %}
  <circle cx="43.5" cy="33" r="1.7" fill="#1b1814"/><circle cx="56.5" cy="33" r="1.7" fill="#1b1814"/>
  <path d="M50,34 Q48,40 50.5,41" stroke="#000" stroke-opacity=".3" stroke-width="1.2" fill="none"/>
  {% if v.moustache %}<path d="M43,44 Q50,40 57,44 Q50,43 43,44 Z" fill="{{ v.cheveux }}" stroke="{{ v.cheveux }}" stroke-width="1.5"/>{% endif %}
  {% if v.bouche == 'sourire' %}<path d="M45,45 Q50,49 55,45" stroke="#6b2a22" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  {% elif v.bouche == 'moue' %}<path d="M45,47 Q50,43.5 55,47" stroke="#6b2a22" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  {% elif v.bouche == 'pincee' %}<path d="M47,46 H53" stroke="#6b2a22" stroke-width="1.8" stroke-linecap="round"/>
  {% else %}<path d="M45,46 H55" stroke="#6b2a22" stroke-width="1.4" stroke-linecap="round"/>{% endif %}
  {% if v.cicatrice %}<path d="M58,36 L62,42 M58.5,38.5 L61,37.5 M60,40.5 L62.3,39.6" stroke="#7a3b30" stroke-width=".9"/>{% endif %}
  {% if v.lunettes %}<g fill="rgba(200,220,255,.18)" stroke="#141414" stroke-width="1.3"><circle cx="43.5" cy="33" r="4.6"/><circle cx="56.5" cy="33" r="4.6"/><path d="M48.1,33 H51.9 M38.9,32 L35,31 M61.1,32 L65,31" fill="none"/></g>{% endif %}
  {% if v.chapeau %}<g fill="#1d1b19"><ellipse cx="50" cy="19" rx="23" ry="4"/><path d="M36,19 Q36,5 50,5 Q64,5 64,19 Z"/></g>
    <path d="M36.4,16 H63.6" stroke="#8e1b17" stroke-width="2.6"/>{% endif %}
  </g>
</g>
{% endmacro %}
